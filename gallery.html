<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeri</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0F2A2E; --bg-panel:#153A3F; --cream:#F5F1E8;
    --amber:#E8A33D; --sage:#7FA69B; --line:rgba(245,241,232,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-deep); color:var(--cream);
    font-family:'Work Sans', sans-serif; min-height:100vh;
    display:flex; justify-content:center; padding:20px 16px 60px;
  }
  .page{ width:100%; max-width:480px; }
  .topbar{
    display:flex; align-items:center; gap:12px; margin-bottom:20px;
    position:sticky; top:0; background:var(--bg-deep); padding:4px 0 12px;
  }
  .back-btn{
    width:36px; height:36px; border-radius:50%; background:var(--bg-panel);
    border:1px solid var(--line); color:var(--cream); text-decoration:none;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  h1{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; }
  .gallery-stack a{
    display:block; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); margin-bottom:12px;
  }
  .gallery-stack img{ width:100%; display:block; }
  .loading, .empty{ text-align:center; color:var(--sage); font-size:14px; margin-top:60px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="back-btn" href="index.html">←</a>
    <h1 id="pageTitle">Memuat...</h1>
  </div>
  <div id="galleryContent"></div>
</div>

<script>
async function render() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const titleEl = document.getElementById('pageTitle');
  const content = document.getElementById('galleryContent');

  if (!id) {
    titleEl.textContent = 'Galeri';
    content.innerHTML = '<p class="empty">Galeri tidak ditemukan.</p>';
    return;
  }

  let blocks = [];
  try {
    const res = await fetch('/api/blocks');
    blocks = await res.json();
  } catch (e) {
    titleEl.textContent = 'Galeri';
    content.innerHTML = '<p class="empty">Gagal memuat data.</p>';
    return;
  }

  const block = blocks.find(b => b.id === id);
  if (!block || !block.images) {
    titleEl.textContent = 'Galeri';
    content.innerHTML = '<p class="empty">Galeri tidak ditemukan.</p>';
    return;
  }

  titleEl.textContent = block.title || 'Galeri';

  if (!block.images.length) {
    content.innerHTML = '<p class="empty">Belum ada foto di galeri ini.</p>';
    return;
  }

  content.innerHTML = '<div class="gallery-stack">' +
    block.images.map(src =>
      `<a href="${escapeAttr(src)}" target="_blank"><img src="${escapeAttr(src)}" alt=""></a>`
    ).join('') +
    '</div>';
}

function escapeAttr(str) {
  return String(str || '#').replace(/"/g, '&quot;');
}

render();
</script>
</body>
</html>
